[build-system]
requires = [
    "setuptools>=77.0.3,<81",
    "wheel>=0.45,<1",
]
build-backend = "setuptools.build_meta"

[project]
name = "serverless-llm"
version = "0.8.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
sllm = "sllm.cli.clic:cli"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
optional-dependencies.worker = {file = ["requirements-worker.txt"]}
optional-dependencies.test = {file = ["requirements-worker.txt", "requirements-test.txt"]}

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
serverless-llm-store = {path = "sllm_store"}

[dependency-groups]
cpu = [
    "pytest==8.4.2", "pytest-asyncio==1.2.0", "packaging==25.0",
    "ray==2.48.0", "fastapi>=0.133.0,<0.137.0", "httpx>=0.27.0",
    "click>=8.4.2,<9", "openai>=2.25.0,<3",
]
build = ["cmake>=3.20,<4", "ninja", "setuptools>=77.0.3,<81", "wheel>=0.45,<1"]


[tool.ruff]
line-length = 80
exclude = []

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = [
    # star imports
    "F405",
    "F403",
    # lambda expression assignment
    "E731",
    # Loop control variable not used within loop body
    "B007",
    # raise distinguish errors
    "B904",
    # f-string format
    "UP032",
]
select = [
    # isort
    "I",
]
ignore = [
    # Loop control variable not used within loop body
    "B007"
]


[tool.isort]
use_parentheses = true
skip_gitignore = true

[tool.codespell]
skip = 'build,*.egg-info,images'
quiet-level = 1
