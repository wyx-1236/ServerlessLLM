[build-system]
requires = [
    "setuptools>=77.0.3,<81",
    "wheel>=0.45,<1",
    "cmake>=3.20,<4.0.0",
    "ninja",
    "torch==2.13.0",
    "numpy",
]
build-backend = "setuptools.build_meta"

[project]
name = "serverless-llm-store"
version = "0.8.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.7.0",
    "attrs>=22.2.0",
    "bitsandbytes==0.46.0",
    "click>=8.4.2,<9",
    "grpcio==1.76.0",
    "grpcio-tools==1.76.0",
    "httpx>=0.27.0",
    "peft>=0.16.0",
    "pillow>=10.3.0",
    "pydantic>=2.12.0,<3",
    "torch==2.13.0",
    "transformers==5.17.0",
    "uvicorn[standard]>=0.30.0,<1",
]

[project.scripts]
sllm-store = "sllm_store.cli:main"

[project.optional-dependencies]
vllm = ["vllm==0.31.0", "pillow>=10.3.0"]
test = ["pytest", "accelerate>=0.27.2", "transformers==5.17.0", "parameterized"]


[tool.ruff]
line-length = 80
exclude = [
    "sllm_store/proto",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    # "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    # "I",
]
ignore = []


[tool.isort]
use_parentheses = true
skip_gitignore = true
